<title>Tabula Databases</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: database list rail on the left; the open database shows a view bar, a filter/sort bar, then the table or board; rows open in a side panel. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#1d2421; --muted:#636d68; --line:#e1e5e2; --hover:#eef1ef;
  --accent:#147a64; --accent-soft:#dcefe9; --danger:#b4433b;
  --t-gray:#e6e8e6; --t-brown:#efe3d8; --t-orange:#fbe2cf; --t-yellow:#f8efc4; --t-green:#d8eedd; --t-blue:#d9e7f7; --t-purple:#e8def5; --t-pink:#f6dde9; --t-red:#f8dbd7;
  --t-ink:#27302c;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1b201e; --ink:#e4e9e6; --muted:#97a29c; --line:#2c3330; --hover:#232a27;
  --accent:#52c4a6; --accent-soft:#1f3a33; --danger:#ef7d73;
  --t-gray:#353b38; --t-brown:#4a3a2e; --t-orange:#5a3a22; --t-yellow:#544a1d; --t-green:#244331; --t-blue:#22394f; --t-purple:#3b2d52; --t-pink:#4f2a3c; --t-red:#55292a;
  --t-ink:#eef2ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1b201e; --ink:#e4e9e6; --muted:#97a29c; --line:#2c3330; --hover:#232a27;
  --accent:#52c4a6; --accent-soft:#1f3a33; --danger:#ef7d73;
  --t-gray:#353b38; --t-brown:#4a3a2e; --t-orange:#5a3a22; --t-yellow:#544a1d; --t-green:#244331; --t-blue:#22394f; --t-purple:#3b2d52; --t-pink:#4f2a3c; --t-red:#55292a;
  --t-ink:#eef2ef; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
@media (max-width:800px){.app{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.rail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px;padding:0 9px}
.badge{width:20px;height:20px;border-radius:5px;background:var(--accent);color:var(--surface);font-size:11px;font-weight:600;display:inline-grid;place-items:center;flex:none}
.rail li button .nm{display:flex;gap:9px;align-items:center;min-width:0}
.rail li button .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newdb{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;text-align:left;color:var(--muted);font-size:13px}
.newdb:hover{color:var(--ink);background:var(--hover)}
.rail li button{width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.rail li button:hover{background:var(--hover)}
.rail li button[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.rail small{color:var(--muted);font-family:var(--mono);font-size:11px}
.hint{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--danger)}
.main{min-width:0}
.dbhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 14px;margin-bottom:10px}
.dbhead .main{display:grid;gap:4px;min-width:0}
.linked{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.linked button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 7px;font-size:12.5px;color:var(--ink)}
.linked button:hover{background:var(--hover)}
.dbmeta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:10px}
.search{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:5px 10px;min-width:0;width:200px;max-width:100%}
.rowcount{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.btn.ghost.on{color:var(--accent)}
.rel{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12.5px;line-height:20px;background:var(--surface);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
.dbtitle{font-family:var(--display);font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.015em;border:0;background:none;padding:2px 4px;margin-left:-4px;border-radius:4px;min-width:0;width:auto;max-width:100%}
.dbtitle:hover{background:var(--hover)}
.tag-ex{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.views{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:end}
.views button{border:0;background:none;padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.views button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0}
.toolbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;max-width:100%}
.chip select,.chip input{border:0;background:transparent;color:inherit;font-size:12.5px;max-width:140px;padding:1px 0}
.chip input{border-bottom:1px solid currentColor;width:100px}
.chip .x{border:0;background:none;color:inherit;padding:0 5px;border-radius:999px}
.chip .x:hover{background:var(--surface)}
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:200px;max-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow:auto}
.pop button.item{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px}
.pop button.item:hover{background:var(--hover)}
.pop label{display:grid;gap:3px;font-size:12px;color:var(--muted);padding:4px 6px}
.pop input,.pop select,.pop textarea{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:5px 7px;color:var(--ink)}
.pop .sep{height:1px;background:var(--line);margin:5px 0}
.pop .row{display:flex;gap:6px;padding:4px 6px}
.ic{width:16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
/* table */
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}
th{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
th button.h{border:0;background:none;color:inherit;padding:7px 8px;width:100%;text-align:left;display:flex;gap:6px;align-items:center}
th button.h:hover{background:var(--hover)}
td .cell{min-height:34px;padding:6px 8px;width:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:0;background:none;text-align:left;cursor:text}
td .cell:hover{background:var(--hover)}
td.num .cell{justify-content:flex-end;font-family:var(--mono);font-size:13px}
td input.edit,td select.edit{width:100%;border:0;padding:6px 8px;min-height:34px;background:var(--surface);outline:2px solid var(--accent);outline-offset:-2px}
.titlecell{display:flex;align-items:center}
.titlecell .cell{flex:1;font-weight:500}
.open{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px;opacity:0}
tr:hover .open,.open:focus-visible{opacity:1}
@media (hover:none){.open{opacity:1}}
.addrow{border:0;background:none;color:var(--muted);padding:7px 8px;width:100%;text-align:left}
.addrow:hover{background:var(--hover);color:var(--ink)}
tfoot td{color:var(--muted);font-size:12px}
tfoot select{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 4px;width:100%;text-align:right}
tfoot .agg{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:6px}
tfoot b{color:var(--ink);font-weight:500;font-family:var(--mono)}
.tg{display:inline-block;border-radius:4px;padding:0 6px;font-size:12.5px;line-height:20px;background:var(--t-gray);color:var(--t-ink);white-space:nowrap}
.check{width:16px;height:16px;accent-color:var(--accent)}
.url{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.empty{color:var(--muted);padding:24px 8px}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding:8px 0 12px;align-items:flex-start}
.col{flex:0 0 260px;background:color-mix(in srgb,var(--hover) 70%,transparent);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{display:flex;align-items:center;gap:8px;font-size:13px}
.colhead small{color:var(--muted);font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-align:left;display:grid;gap:6px;cursor:grab;width:100%}
.card:hover{border-color:var(--muted)}
.card b{font-weight:500}
.card .props{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted)}
/* list */
.list{border-top:1px solid var(--line)}
.list button.li{display:flex;width:100%;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 6px;text-align:left;flex-wrap:wrap}
.list button.li:hover{background:var(--hover)}
.list .li b{font-weight:500;margin-right:auto}
/* peek */
.peek{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(0,0,0,.12);z-index:25;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:14px}
.peek .ptitle{font-family:var(--display);font-size:26px;font-weight:700;border:0;background:none;padding:2px 0;width:100%}
.props-grid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:2px 10px;align-items:start}
.props-grid .k{color:var(--muted);padding:7px 0;display:flex;gap:6px;align-items:center;font-size:13px}
.props-grid .v{min-width:0}
.props-grid .v .cell{min-height:32px;padding:6px 6px;width:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:0;background:none;text-align:left;border-radius:4px}
.props-grid .v .cell:hover{background:var(--hover)}
.props-grid input.edit,.props-grid select.edit{width:100%;border:1px solid var(--accent);border-radius:4px;padding:5px 6px;background:var(--surface)}
.peek textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;display:flex;gap:10px;align-items:center}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}
.muted{color:var(--muted)}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M1 8h20M8 8v13" stroke="currentColor" stroke-width="2" fill="none"/></svg>Tabula</div>
    <h2>Databases</h2>
    <ul id="dbList"></ul>
    <button class="newdb" type="button" id="newDb">+ New database</button>
    <p class="hint" id="storeNote">Saved in this browser.</p>
    <p class="hint">Undo with Ctrl/⌘+Z.</p>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="pop" id="pop" hidden></div>
<aside class="peek" id="peek" hidden aria-label="Row details"></aside>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { TYPES, COLORS, OPS, opKind, AGGS, blankDb, titleProp, optOf, valueOf, displayText, fmtNum, fmtDate, isEmpty, runFormula, runQuery, aggregate, aggOptions, ROLLUP_FNS, setResolver, relatedRows } from "./engine.js";
(() => {
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "text") n.textContent = v;
    else if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") n.value = v;
    else if (k === "checked") n.checked = !!v;

  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const uid = () => Math.random().toString(36).slice(2, 9);

// ---- State ----
let dbs = [];
let curId = null, curViewId = null, peekRowId = null, editing = null, searchQ = "";
setResolver(id => dbs.find(d => d.id === id)); // relations and rollups read linked databases from memory
const dbById = id => dbs.find(d => d.id === id);
const undoStack = [];

// ---- Server sync: every edit becomes a transaction of small operations ----
const CLIENT_ID = Math.random().toString(36).slice(2);
const params = new URLSearchParams(location.search);
let token = params.get("token") || "";
try { if (token) localStorage.setItem("tabula.token", token); else token = localStorage.getItem("tabula.token") || ""; } catch {}
async function api(method, path, body) {
  const res = await fetch("/api" + path, { method, headers: { "content-type": "application/json", "x-client-id": CLIENT_ID, ...(token ? { authorization: "Bearer " + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "Request failed (" + res.status + ")"); e.status = res.status; throw e; }
  return data;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// Compare two copies of a database and list the operations that turn one into the other.
function diff(before, after) {
  const ops = [];
  if (before.name !== after.name) ops.push({ op: "rename_database", name: after.name });
  const bk = Object.keys(before.schema), ak = Object.keys(after.schema);
  // Delete rows and views before properties, and add properties before rows that use them.
  const bRows = new Map(before.rows.map(r => [r.id, r])), aRows = new Map(after.rows.map(r => [r.id, r]));
  for (const id of bRows.keys()) if (!aRows.has(id)) ops.push({ op: "delete_row", id });
  const bViews = new Map(before.views.map(v => [v.id, v]));
  const aViewIds = new Set(after.views.map(v => v.id));
  const viewDeletes = [...bViews.keys()].filter(id => !aViewIds.has(id)).map(id => ({ op: "delete_view", id }));
  ak.forEach((k, i) => { if (!before.schema[k] || !same(before.schema[k], after.schema[k]) || bk.indexOf(k) !== i) ops.push({ op: "set_property", id: k, property: after.schema[k], position: i }); });
  after.views.forEach((v, i) => { const o = bViews.get(v.id); const idx = before.views.findIndex(x => x.id === v.id); if (!o || !same(o, v) || idx !== i) ops.push({ op: "set_view", id: v.id, view: { name: v.name, type: v.type, format: v.format, query2: v.query2 }, position: i }); });
  ops.push(...viewDeletes);
  for (const k of bk) if (!after.schema[k]) ops.push({ op: "delete_property", id: k });
  for (const [id, r] of aRows) {
    const o = bRows.get(id);
    if (!o) { ops.push({ op: "add_row", row: { id, created: r.created, body: r.body || "", props: Object.fromEntries(Object.entries(r.props).filter(([k]) => after.schema[k])) } }); continue; }
    for (const k of new Set([...Object.keys(o.props), ...Object.keys(r.props)])) if (after.schema[k] && !same(o.props[k] ?? null, r.props[k] ?? null)) ops.push({ op: "set_value", row_id: id, property_id: k, value: r.props[k] ?? null });

  }
  return ops;
}
const queues = new Map(); // one in-flight chain per database keeps transactions in order
function push(before, after, label) {
  const ops = diff(before, after); if (!ops.length) return;
  const run = () => api("POST", "/databases/" + after.id + "/transactions", { user_action: label, operations: ops })
    .then(r => { const d = dbs.find(x => x.id === after.id); if (d) d.version = r.version; setStatus("Saved"); })
    .catch(e => { setStatus("Not saved"); toast("Couldn't save: " + e.message + ". Reloading from the server."); reloadOne(after.id); });

function setStatus(t) { const n = $("#storeNote"); if (n) n.textContent = t === "Saved" ? "Saved to your server." : t === "Saving…" ? "Saving…" : "Some changes weren't saved."; }
async function reloadOne(id) {
  try { const fresh = await api("GET", "/databases/" + id); const i = dbs.findIndex(d => d.id === id); if (i >= 0) dbs[i] = fresh; else dbs.push(fresh); }
  catch (e) { if (e.status === 404) { dbs = dbs.filter(d => d.id !== id); if (curId === id) { curId = dbs[0]?.id ?? null; curViewId = dbs[0]?.views[0].id ?? null; } } }
  if (!dbs.some(d => d.id === curId)) { curId = dbs[0]?.id ?? null; curViewId = dbs[0]?.views[0]?.id ?? null; }
  render();
}

// ---- Transactions with undo (each edit snapshots the database first) ----
// An edit can touch two databases (a two-way relation), so the snapshot covers all of them
// and each database that changed gets its own transaction.
function commit(label, fn) {
  const db = cur(); if (!db) return;
  const snapshot = JSON.stringify(dbs);
  undoStack.push({ dbId: db.id, label, snapshot });
  if (undoStack.length > 100) undoStack.shift();

  syncRelations(db);
  for (const before of JSON.parse(snapshot)) { const after = dbById(before.id); if (after) push(before, after, label); }
  render();
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  const saved = JSON.parse(u.snapshot);
  if (!Array.isArray(saved)) { restoreDeleted(saved); return; }
  for (const restored of saved) {
    const i = dbs.findIndex(d => d.id === restored.id); if (i < 0) continue;
    const before = dbs[i]; restored.version = before.version; dbs[i] = restored;
    push(before, restored, "Undo: " + u.label);

function restoreDeleted(d) {
  dbs.push(d); curId = d.id; curViewId = d.views[0].id; render();

// Keep two-way relations in step: the other side lists exactly the rows that point at it.
function syncRelations(db) {
  for (const [key, p] of Object.entries(db.schema)) {

// The table/board/list area, redrawn on its own while typing in the search box.

$("#newDb").addEventListener("click", async () => { let d; try { d = await api("POST", "/databases", blankDb()); } catch (e) { toast("Couldn't create a database: " + e.message); return; } dbs.push(d); openDb(d.id); setTimeout(() => $(".dbtitle")?.select(), 0); });

// ---- Boot ----
async function boot() {

  catch (e) {

    $("#storeNote").textContent = "Not connected."; return;
  }
  curId = dbs[0]?.id ?? null; curViewId = dbs[0]?.views[0]?.id ?? null;
  $("#storeNote").textContent = "Saved to your server.";
  render();
  // Live updates: other tabs or API clients changed something.
  const es = new EventSource("/api/events" + (token ? "?token=" + encodeURIComponent(token) : ""));
  es.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.client === CLIENT_ID) return;
    const local = dbs.find(d => d.id === ev.id);

const pendingReload = new Set();

})();
